<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>한글 첫 달 - 달토끼</title>
<meta property="og:title" content="한글 첫 달 - 달토끼">

<meta name="description" content="달토끼 한글 첫 달. 여덟 밤 동안 기본 모음부터 겹받침까지 소리 중심으로 한글 떼기를 합니다. 무료, 광고 없음, 가입 없음.">

</head>
<body>
<script src="../assets/i18n.js?v=20261002"></script>
<script src="../assets/lang/first-moon.js?v=20261002"></script>

<header>
  <a class="back" id="siteHome" href="../">달토끼 처음으로</a>
  <button class="back" id="homeBtn">밤 고르기</button>
  <div class="title" id="hdrTitle">한글 첫 달</div>
  <div class="moonbar">
    <span id="stepLabel"></span>
    <div class="track"><i id="trackFill"></i></div>
  </div>
</header>

<div id="envNote" class="envnote" role="region" aria-label="소리 안내" hidden></div>

<main><div class="card" id="card"></div></main>

<div id="audioNote" role="status">이 기기에서는 소리가 안 나와요. 글자와 뜻으로 먼저 해 보고, 소리는 다른 기기에서 들어 보세요. <u>눌러서 닫기</u></div>

<div class="footbar">
  <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  <div style="display:flex;align-items:center;gap:16px">
    <label class="toggle"><input type="checkbox" id="hintToggle"> 소리 힌트</label>
    <button class="btn" id="nextBtn">다음</button>
  </div>
</div>

<script src="../assets/dal.js?v=20261102"></script>
<script src="../content/first-moon.js?v=20261102"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   첫째 달 페이지: 여덟 밤의 화면, 빠른 확인, 녹음 목록
   ══════════════════════════════════════════════════════════════ */

/* ---- 진도 저장 ---- */
const STORE_KEY = 'daltokki:v1:first-moon';
function loadStars(){
  const out = {};
  if(!canStore) return out;
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(data && data.stars && typeof data.stars === 'object'){
      for(const k in data.stars){
        const n = Number(k), v = Number(data.stars[k]);
        if(n >= 1 && n <= MODULES.length && v >= 1 && v <= 3) out[n] = Math.round(v);
      }
    }
  } catch(e) {}
  return out;
}
/* start 는 빠른 확인이 정한 시작할 밤입니다. 그 앞의 밤에는 별을 주지 않고,
   "확인으로 통과"로만 표시합니다. 9 는 여덟 밤을 모두 통과했다는 뜻입니다. */
function loadStart(){
  if(!canStore) return 1;
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    const v = Number(data && data.start);
    if(Number.isInteger(v) && v >= 1 && v <= MODULES.length + 1) return v;
  } catch(e) {}
  return 1;
}
function saveStars(){
  if(!canStore) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({stars, start: startNight, updated: Date.now()})); } catch(e) {}
}
function resetStars(){
  for(const k in stars) delete stars[k];
  startNight = 1;
  if(canStore){ try { localStorage.removeItem(STORE_KEY); localStorage.removeItem('daltokki:v1:dictation'); } catch(e) {} }
  try { dstate = {words:{}, days:0, last:'', errs:{}}; } catch(e) {}
}
const stars = loadStars();
let startNight = loadStart();


/* ---- 상태 ---- */
let mod = null, pool = null, steps = [], step = 0, score = 0, maxScore = 0;

document.getElementById('homeBtn').addEventListener('click', showPicker);

nextBtn.addEventListener('click', () => {
  if(step < steps.length - 1){ step++; render(); }
  else showPicker();
});


/* ---- 모듈 선택 화면 ---- */
function showPicker(){
  mod = null;
  curGuide = null;
  hdrTitle.textContent = '한글 첫 달';
  document.getElementById('stepLabel').textContent = '';
  document.getElementById('trackFill').style.width = '0%';
  nextBtn.style.visibility = 'hidden';
  setNav(false);
  setFeedback('');
  card.innerHTML = '';
  card.append(
    h('h2', {}, '한글 첫 달'),
    trio(),
    guide('tori', '안녕, 나는 토리야. 달은 밤마다 조금씩 차올라. 여덟 밤이 지나면 보름달이 뜨고, 그때는 한글을 다 읽을 수 있어. 모이랑 담이랑 같이 가자.')
  );
  const started = Object.keys(stars).length > 0 || startNight > 1;
  card.append(h('div', {class:'checkcta'},
    h('button', {class:'btn quiet play', onclick: startCheck},
      started ? '빠른 확인 다시 하기' : '한글을 조금 읽을 줄 알아요'),
    h('span', {}, '몇 문제만 풀면 시작할 밤을 찾아 줘요.')));
  const didToday = dstate.last === todayStr();
  card.append(h('button', {class:'roomcard', onclick: () => { location.href = '../dictation/'; }},
    h('div', {html: CHAR.tori('')}),
    h('div', {}, h('b', {}, '받아쓰기실'),
      h('span', {}, didToday ? '오늘 방아를 찧었어요. 한 번 더 해도 돼요.' : '오늘의 방아. 다섯 개만 듣고 써 봐요.'))));
  const nextUp = (MODULES.find(m => !stars[m.n] && m.n >= startNight) || {}).n;
  const g = h('div', {class:'modgrid'});
  MODULES.forEach(m => {
    const got = stars[m.n] || 0;
    const passed = !got && m.n < startNight;
    const jm = [...m.add.jung, ...m.add.cho, ...m.add.jong].join(' ');
    const isNext = m.n === nextUp && started;
    const label = h('span', {class:'night'}, nightName(m.n));
    if(isNext) label.append(h('span', {class:'here'}, '여기부터'));
    g.append(h('button', {class:'modcard' + (isNext ? ' next' : ''),
        'aria-label': nightName(m.n) + ', ' + m.title + (got ? ', 별 ' + got + '개' : passed ? ', 확인으로 통과' : ', 아직 안 했어요'),
        onclick: () => startModule(m.n)},
      h('div', {html: moonSVG(m.n, 56, !!stars[m.n])}),
      h('div', {style:'flex:1'},
        label,
        h('b', {}, m.title),
        got ? h('span', {}, '★'.repeat(got) + '☆'.repeat(3-got))
            : passed ? h('span', {class:'pass'}, '확인으로 통과') : h('span', {}, '아직 안 했어요'),
        h('div', {class:'jm'}, jm || '받침 연습')
      )
    ));
  });
  card.append(g);

  const done = Object.keys(stars).length;
  const passedCount = MODULES.filter(m => !stars[m.n] && m.n < startNight).length;
  const progressText = [
    done ? '지금까지 ' + COUNT[done - 1] + ' 밤을 마쳤습니다.' : '',
    passedCount ? '빠른 확인으로 ' + COUNT[passedCount - 1] + ' 밤을 통과했습니다.' : ''
  ].filter(Boolean).join(' ') || '아직 시작하기 전입니다.';
  const resetBtn = h('button', {}, '처음부터 다시 하기');
  let armed = false;
  resetBtn.addEventListener('click', () => {
    if(!armed){ armed = true; resetBtn.textContent = '기록이 모두 지워져요. 한 번 더 누르면 지웁니다'; return; }
    resetStars(); showPicker();
  });
  card.append(h('div', {class:'parents'},
    h('b', {}, '부모님께. '),
    '한글 첫 달은 기본 모음에서 겹받침까지 여덟 밤에 걸쳐 한글 떼기를 돕습니다. 순서대로 하는 게 좋지만 아이가 이미 아는 밤은 건너뛰어도 됩니다. ',
    canStore
      ? '진도는 이 기기의 브라우저에만 저장되고, 이름이나 개인정보는 저장하지 않습니다. ' + progressText
      : '이 브라우저에서는 진도가 저장되지 않습니다. 창을 닫으면 기록이 사라집니다.',
    (done || startNight > 1) && canStore ? h('div', {}, resetBtn) : ''
  ));
}


/* ---- 모듈 시작 ---- */
function startModule(n){
  mod = MODULES.find(m => m.n === n);
  try { preloadClips(listClips().filter(c => c.night === n).map(c => c.text)); } catch(e) {}
  pool = poolUpTo(n);
  score = 0;
  maxScore = mod.listen.length + mod.dict.length;
  steps = [intro, soundScreen, strokeScreen, traceScreen, buildScreen, listenScreen, wordScreen];
  if(mod.cmp) steps.push(compareScreen);
  steps.push(dictationScreen, resultScreen);
  step = 0;
  setNav(true);
  render();
}

function render(){
  card.innerHTML = '';
  setFeedback('');
  hdrTitle.textContent = nightName(mod.n) + '. ' + mod.title;
  nextBtn.textContent = step === steps.length - 1 ? '밤 고르기' : '다음';
  nextBtn.style.visibility = 'visible';
  document.getElementById('stepLabel').textContent = (step+1) + ' / ' + steps.length;
  document.getElementById('trackFill').style.width = (step/(steps.length-1)*100) + '%';
  curGuide = null;
  steps[step]();
  window.scrollTo(0,0);
}

/* ---- 1. 들어가기 ---- */
function intro(){
  const newJamo = [...mod.add.jung, ...mod.add.cho, ...mod.add.jong];
  card.append(
    h('h2', {}, mod.title),
    guide('tori', mod.why + (mod.note && !mod.cmp && mod.note.w === 'tori' ? ' ' + mod.note.t : '')),
    h('div', {class:'strokebox', style:'display:inline-block;padding:18px 26px;cursor:default'},
      h('div', {style:'font-size:44px;line-height:1.5;letter-spacing:.06em'},
        newJamo.length ? newJamo.join(' ') : '지금까지 배운 받침으로 연습해요')
    ),
  );
  if(mod.note && !mod.cmp && mod.note.w !== 'tori') card.append(guide(mod.note.w, mod.note.t, true));
}

/* ---- 2. 소리 듣기 ---- */
function soundScreen(){
  card.append(h('h2', {}, '소리를 들어 봐요'),
              guide('tori', '내 귀는 아주 커서 소리를 잘 들어. 글자를 누르면 내가 소리 내 줄게. 빨간 테두리가 오늘 새로 만나는 글자야.'));
  const make = (list, cls, label) => {
    if(!list.length) return null;
    const role = label === '모음' ? 'jung' : label === '받침' ? 'jong' : 'cho';
    const wrap = h('div', {});
    wrap.append(h('p', {class:'grouplabel'}, label));
    const g = h('div', {class:'grid', style:'margin-bottom:20px'});
    list.forEach(j => {
      const meta = JAMO[j] || {h:''};
      const isNew = [...mod.add.cho, ...mod.add.jung, ...mod.add.jong].includes(j);
      const hint = jamoHint(j, role);
      const hintEl = h('small', {'data-hint':hint}, hintsOn() ? hint : '');
      g.append(h('button', {
        class:'tile ' + cls, style: isNew ? 'border-color:var(--juhong)' : '',
        'aria-label': j + ' 소리 듣기',
        onclick: e => {
          speak(jamoSound(j, role));
          /* currentTarget 은 핸들러가 끝나면 null 이 됩니다.
             지연 실행 안에서 쓰려면 지금 붙잡아 둬야 합니다. */
          const el = e.currentTarget;
          el.classList.add('playing');
          setTimeout(() => el.classList.remove('playing'), 500);
        }
      }, j, hintEl));
    });
    wrap.append(g);
    return wrap;
  };
  [make(pool.jung, 'vowel', '모음'),
   make(pool.cho, '', '자음'),
   make(pool.jong, '', '받침')].forEach(x => x && card.append(x));
}

/* ---- 3. 획순 ---- */
function strokeScreen(){
  const list = [...mod.add.jung, ...mod.add.cho, ...mod.add.jong].filter(j => JAMO[j] && JAMO[j].s);
  card.append(h('h2', {}, '어떻게 쓰는지 봐요'),
              guide('tori', list.length ? '글자는 쓰는 순서가 정해져 있어. 글자를 누르면 순서를 다시 보여 줄게.'
                : '이번에는 새로 쓰는 글자가 없어. 겹받침은 이미 아는 자음 두 개를 나란히 쓰면 돼.'));
  if(!list.length){
    const l2 = [...mod.add.jong];
    const g = h('div', {class:'grid'});
    l2.forEach(j => g.append(h('div', {class:'tile', style:'cursor:default'}, j)));
    card.append(g);
    return;
  }
  const box = h('div', {class:'strokes'});
  list.forEach(j => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('width','88'); svg.setAttribute('height','88');
    JAMO[j].s.forEach(d => {
      const p = document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d', d); p.setAttribute('class','animpath');
      svg.append(p);
    });
    const b = h('button', {class:'strokebox', 'aria-label': j + ' 쓰는 순서 보기',
      onclick: () => { animate(svg); speak(jamoSound(j, roleOf(j))); }});
    b.append(svg, h('span', {}, j));
    box.append(b);
    animate(svg);
  });
  card.append(box);
  function animate(svg){
    let delay = 0;
    [...svg.querySelectorAll('path')].forEach(p => {
      const len = p.getTotalLength();
      p.style.transition = 'none';
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      setTimeout(() => {
        p.style.transition = 'stroke-dashoffset .5s linear';
        p.style.strokeDashoffset = 0;
      }, delay + 60);
      delay += 560;
    });
  }
}

/* ---- 4. 따라 쓰기 ---- */
function traceScreen(){
  card.append(h('h2', {}, '따라 써 봐요'),
              guide('tori', '옅은 글자 위를 손가락으로 따라 그어 봐. 아까 본 순서대로 쓰면 더 좋아.'));
  const all = [...mod.add.jung, ...mod.add.cho, ...mod.add.jong];
  const list = all.length ? all : pool.jong;
  let current = list[0];
  const canvas = h('canvas', {id:'pad', width:300, height:300, 'aria-label':'따라 쓰기 연습판'});
  const pick = h('div', {class:'tracepick'});
  list.forEach(j => {
    const b = h('button', {'aria-pressed': j === current ? 'true' : 'false', onclick: () => {
      current = j;
      [...pick.children].forEach(c => c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      drawTraceBase(); speak(jamoSound(j, roleOf(j)));
    }}, j);
    pick.append(b);
  });
  card.append(h('div', {class:'tracewrap'}, canvas, pick),
    h('button', {class:'btn quiet play', style:'margin-top:14px', onclick: drawTraceBase}, '지우기'));

  const ctx = canvas.getContext('2d');
  function drawTraceBase(){
    ctx.clearRect(0,0,300,300);
    ctx.fillStyle = '#F5E6BD'; ctx.fillRect(0,0,300,300);
    ctx.strokeStyle = '#D5C69C'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(150,10); ctx.lineTo(150,290);
    ctx.moveTo(10,150); ctx.lineTo(290,150); ctx.stroke();
    ctx.fillStyle = '#CBBB90';
    ctx.font = '220px "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(current, 150, 158);
  }
  drawTraceBase();
  let drawing = false;
  const pos = e => { const r = canvas.getBoundingClientRect();
    return [(e.clientX-r.left)*(300/r.width), (e.clientY-r.top)*(300/r.height)]; };
  canvas.addEventListener('pointerdown', e => {
    drawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    const [x,y] = pos(e);
    ctx.strokeStyle = '#221F1C'; ctx.lineWidth = 15;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x,y);
  });
  canvas.addEventListener('pointermove', e => {
    if(!drawing) return; const [x,y] = pos(e); ctx.lineTo(x,y); ctx.stroke();
  });
  canvas.addEventListener('pointerup', () => drawing = false);
  canvas.addEventListener('pointerleave', () => drawing = false);
}

/* ---- 5. 글자 조립 ---- */
function buildScreen(){
  const useJong = pool.jong.length > 0;
  card.append(h('h2', {}, '글자를 만들어 봐요'),
    guide('moi', useJong
      ? '나는 모으는 걸 좋아해. 자음이랑 모음을 모으면 글자가 되고, 받침을 누르면 아래에 붙어.'
      : '나는 모으는 걸 좋아해. 자음 하나랑 모음 하나를 모으면 글자가 돼. 골라 봐.'));
  let cho = null, jung = null, jong = null;
  const sC = h('div', {class:'slot'}, ''), sV = h('div', {class:'slot'}, '');
  const sJ = h('div', {class:'slot optional'}, '');
  const out = h('div', {class:'result-syl'}, '');
  const asm = h('div', {class:'assembly'}, sC, h('span',{class:'eq'},'+'), sV);
  if(useJong) asm.append(h('span',{class:'eq'},'+'), sJ);
  asm.append(h('span',{class:'eq'},'='), out);
  card.append(asm);

  card.append(row('자음', pool.cho, mod.add.cho, j => { cho = j; sC.textContent = j; sC.classList.add('filled'); update(); }));
  card.append(row('모음', pool.jung, mod.add.jung, j => { jung = j; sV.textContent = j; sV.classList.add('filled'); update(); }));
  if(useJong){
    const r = row('받침 (없어도 돼요)', pool.jong, mod.add.jong, j => {
      jong = (jong === j) ? null : j;
      sJ.textContent = jong || ''; sJ.classList.toggle('filled', !!jong); update();
    });
    card.append(r);
  }

  function row(label, list, newList, onPick){
    const r = h('div', {class:'pickrow'}, h('b', {}, label));
    list.forEach(j => {
      const b = h('button', {class:'chip' + (newList.includes(j) ? ' new' : ''),
        'aria-pressed':'false', onclick: () => {
          [...r.querySelectorAll('button')].forEach(x => x.setAttribute('aria-pressed','false'));
          b.setAttribute('aria-pressed','true');
          onPick(j);
        }}, j);
      r.append(b);
    });
    return r;
  }
  function update(){
    if(cho && jung){
      const syl = compose(cho, jung, jong);
      out.textContent = syl;
      speak(syl);
      const parts = jong
        ? josa(cho,'와') + ' ' + josa(jung,'와') + ' ' + josa(jong,'이')
        : josa(cho,'와') + ' ' + josa(jung,'이');
      setFeedback(parts + ' 만나면 ' + josa(syl,'이에요') + '.', 'ok');
      react('happy');
    }
  }
}

/* ---- 6. 듣고 고르기 ---- */
function listenScreen(){
  card.append(h('h2', {}, '듣고 골라요'),
    guide('tori', '내가 소리를 낼 테니까 잘 듣고 맞는 글자를 골라 봐. 모두 ' + mod.listen.length + '문제야.'));
  let qi = 0, locked = false;
  const box = h('div', {});
  card.append(box);
  nextBtn.style.visibility = 'hidden';
  draw();
  function draw(){
    box.innerHTML = ''; locked = false;
    const q = mod.listen[qi];
    box.append(h('p', {class:'qbig'}, (qi+1) + '번. 어떤 글자일까요?'));
    if(q.hint) box.append(h('p', {class:'qhint'}, '힌트. ' + q.hint));
    box.append(h('button', {class:'btn play', style:'margin-bottom:18px',
      onclick: () => speak(q.a)}, '다시 듣기'));
    const opts = h('div', {class:'opts'});
    q.o.forEach(o => opts.append(h('button', {class:'opt', onclick: e => {
      if(locked) return; locked = true;
      const btns = [...opts.querySelectorAll('button')];
      btns.forEach(b => b.disabled = true);
      if(o === q.a){
        e.currentTarget.classList.add('right'); score++;
        setFeedback('맞았어요.', 'ok');
        react('happy');
      } else {
        e.currentTarget.classList.add('wrong');
        const good = btns.find(b => b.textContent === q.a);
        if(good) good.classList.add('right');
        setFeedback('이건 ' + josa(q.a,'이에요') + '.', 'no');
        react('oops');
      }
      setTimeout(() => {
        qi++;
        if(qi < mod.listen.length) draw();
        else { setFeedback('다 풀었어요.', 'ok'); nextBtn.style.visibility = 'visible'; }
      }, 1200);
    }}, o)));
    box.append(opts);
    setTimeout(() => speak(q.a), 300);
  }
}

/* ---- 7. 단어 읽기 ---- */
function wordScreen(){
  card.append(h('h2', {}, '배운 글자로 만든 말'),
    guide('moi', '내가 모아 온 말들이야. 카드를 누르면 소리가 나고, 뜻 보기를 누르면 영어 뜻이 나와.'));

  mod.words.forEach(item => {
    const el = h('div', {class:'word', onclick: () => speak(item.w)});
    el.innerHTML = item.p && PIC[item.p] ? PIC[item.p] : `<div class="noimg">${item.w}</div>`;
    const en = h('div', {class:'en'}, '');
    el.append(h('div', {class:'w'}, item.w), en,
      h('button', {onclick: e => { e.stopPropagation(); en.textContent = item.en; }}, '뜻 보기'));
    box.append(el);
  });
  card.append(box);
}

/* ---- 8. 소리와 글자 대조 (7, 8번 모듈) ---- */
function compareScreen(){
  card.append(h('h2', {}, '소리와 글자가 달라요'),
    guide('dami', '옛날 이야기 하나 해 주마. 왼쪽은 쓰는 모양이고, 오른쪽은 실제로 나는 소리란다. 듣기를 눌러서 귀로도 확인해 보거라.'));
  const t = h('table', {class:'cmp'});
  t.append(h('tr', {}, h('th',{},'이렇게 써요'), h('th',{},'이렇게 들려요'), h('th',{},'왜'), h('th',{},'')));
  mod.cmp.forEach(c => {
    t.append(h('tr', {},
      h('td', {class:'sp'}, c.s),
      h('td', {class:'so'}, '[' + c.d + ']'),

      h('td', {}, h('button', {onclick: () => speak(c.s)}, '듣기'))
    ));
  });
  card.append(t);

/* ---- 9. 받아쓰기 ---- */
function dictationScreen(){
  const useJong = pool.jong.length > 0;
  card.append(h('h2', {}, '듣고 써 봐요'),
    guide('tori', '내가 말하는 걸 듣고 써 봐. 한국어 자판이 없어도 괜찮아. 자음이랑 모음을 눌러서 글자를 만들면 돼.'
      + (useJong ? ' 받침은 글자를 다 만든 다음에 눌러.' : '')));
  let qi = 0;
  const box = h('div', {class:'dictbox'});
  card.append(box);
  nextBtn.style.visibility = 'hidden';
  draw();

  function draw(){
    box.innerHTML = '';
    let pendingCho = null, typed = '';
    const target = mod.dict[qi];
    box.append(h('p', {class:'qbig', style:'margin-bottom:10px'},
      (qi+1) + '번. 들리는 말을 써 보세요.'),
      h('button', {class:'btn play', onclick: () => speak(target)}, '다시 듣기'));
    const ans = h('div', {class:'answer', 'aria-live':'polite'}, '');
    box.append(ans);

    const rC = h('div', {class:'pickrow'}, h('b', {}, '자음'));
    pool.cho.forEach(j => rC.append(h('button', {class:'chip', onclick: () => {
      pendingCho = j; setFeedback(''); paint();
    }}, j)));
    const rV = h('div', {class:'pickrow'}, h('b', {}, '모음'));
    pool.jung.forEach(j => rV.append(h('button', {class:'chip', onclick: () => {
      if(!pendingCho){ setFeedback('자음을 먼저 눌러요.', 'no'); return; }
      typed += compose(pendingCho, j); pendingCho = null; setFeedback(''); paint();
    }}, j)));
    box.append(rC, rV);

    if(useJong){
      const rJ = h('div', {class:'pickrow'}, h('b', {}, '받침'));
      pool.jong.forEach(j => rJ.append(h('button', {class:'chip', onclick: () => {
        if(!typed){ setFeedback('먼저 글자를 만들어요.', 'no'); return; }
        typed = typed.slice(0,-1) + addJong(typed[typed.length-1], j);
        setFeedback(''); paint();
      }}, j)));
      box.append(rJ);
    }

    const ctrl = h('div', {style:'display:flex;gap:10px;margin-top:6px'},
      h('button', {class:'btn quiet play', onclick: () => {
        pendingCho = null; typed = typed.slice(0,-1); paint();
      }}, '지우기'),
      h('button', {class:'btn play', onclick: check}, '확인'));
    box.append(ctrl);

    function paint(){ ans.textContent = typed + (pendingCho || ''); }
    function check(){
      if(typed === target){
        ans.classList.add('right'); score++;
        setFeedback('맞았어요.', 'ok');
        react('happy');
      } else {
        ans.classList.add('wrong');
        ans.innerHTML = '';
        ans.append(h('span', {class:'diff'}, typed || '(빈칸)'),
          h('span', {style:'font-size:26px;margin:0 14px;color:#6B6256'}, '→'),
          h('span', {}, target));
        setFeedback('어디가 다른지 보세요.', 'no');
        react('oops');
      }
      ctrl.remove();
      setTimeout(() => {
        qi++;
        if(qi < mod.dict.length) draw();
        else { setFeedback('받아쓰기 끝.', 'ok'); nextBtn.style.visibility = 'visible'; }
      }, 2000);
    }
    setTimeout(() => speak(target), 400);
  }
}

/* ---- 10. 결과 ---- */
function resultScreen(){
  const s = score >= maxScore - 1 ? 3 : score >= Math.ceil(maxScore * .6) ? 2 : 1;
  stars[mod.n] = Math.max(stars[mod.n] || 0, s);
  saveStars();
  const next = MODULES.find(m => m.n === mod.n + 1);
  card.append(h('div', {style:'text-align:center;padding-top:10px'},
    h('div', {class:'scene'},
      h('div', {class:'moon', html: moonSVG(mod.n, 160, true)}),
      h('div', {class:'tori', html: CHAR.tori(s === 3 ? 'happy' : '')})),
    h('h2', {}, next ? '오늘 밤 달이 조금 차올랐어요' : '보름달이 떴어요'),
    h('div', {class:'stars'}, '★'.repeat(s) + '☆'.repeat(3-s)),
    h('p', {class:'sub'}, '맞힌 문제 ' + score + ' / ' + maxScore),
    h('div', {style:'max-width:520px;margin:0 auto 22px;text-align:left'},
      say('tori', s === 3
        ? (next ? '떡방아 잘 찧었어. 이제 ' + nightName(next.n) + '으로 가자.' : '여덟 밤을 다 지났어. 이제 한글을 다 읽을 수 있어. 다음은 둘째 달이야.')
        : '괜찮아. 떡은 방아를 여러 번 찧어야 만들어져. 한 번 더 해 볼까?'),
      guide('moi', '오늘 새 말을 ' + mod.words.length + '개 모았어.', true)),
    h('div', {style:'display:flex;gap:12px;justify-content:center;flex-wrap:wrap'},
      h('button', {class:'btn quiet', onclick: () => startModule(mod.n)}, '다시 하기'),
      next ? h('button', {class:'btn', onclick: () => startModule(next.n)}, '다음 밤')
           : h('button', {class:'btn', onclick: showPicker}, '밤 고르기')
    )
  ));
  nextBtn.style.visibility = 'hidden';
}


const REASON = ['',
  '남은 자음 아홉 개를 만나는 밤이야.',
  '길어진 모음 ㅑ ㅕ ㅛ ㅠ를 만나는 밤이야.',
  '헷갈리기 쉬운 모음을 정리하는 밤이야.',
  '쌍둥이 자음을 세게 소리 내는 밤이야.',
  '받침을 처음 만나는 밤이야.',
  '소리는 같은데 글자가 다른 말을 배우는 밤이야. 첫째 달에서 제일 중요한 밤이야.',
  '받침이 두 개인 겹받침을 배우는 밤이야.'];


function startCheck(){
  mod = null; curGuide = null;
  pool = poolUpTo(MODULES.length);
  setNav(true);
  hdrTitle.textContent = '빠른 확인';
  setFeedback('');
  nextBtn.style.visibility = 'hidden';
  document.getElementById('stepLabel').textContent = '';
  const total = CHECK.length + CHECK_DICT.length;
  const bar = p => { document.getElementById('trackFill').style.width = Math.round(p / total * 100) + '%'; };
  let i = 0, stopAt = null;
  intro();

  function intro(){
    card.innerHTML = ''; curGuide = null; bar(0);
    card.append(
      h('h2', {}, '빠른 확인'),
      guide('tori', '한글을 조금 읽을 줄 알아? 몇 문제만 풀어 보면 어느 밤부터 하면 좋을지 알려 줄게. 모르면 모르겠어요를 눌러도 돼. 틀려도 괜찮아.'),
      h('p', {class:'sub'}, '5분이 채 안 걸려요. 소리를 듣고 맞는 글자를 고르면 돼요.'),
      h('button', {class:'btn', onclick: ask}, '시작하기'));
    window.scrollTo(0,0);
  }

  function ask(){
    if(i >= CHECK.length) return dictAsk(0);
    const q = CHECK[i];
    card.innerHTML = ''; curGuide = null; bar(i);
    let locked = false;
    const pick = ok => {
      if(locked) return; locked = true;
      if(ok){ i++; ask(); }
      else { stopAt = q.a; result(q.n); }
    };
    card.append(h('h2', {}, '듣고 골라요'),
      guide('tori', i === 0 ? '잘 듣고 맞는 글자를 골라 봐.' : '좋아, 다음 문제야.'));
    if(q.hint) card.append(h('p', {class:'qhint'}, '힌트. ' + q.hint));
    card.append(h('button', {class:'btn play', style:'margin-bottom:18px', onclick: () => speak(q.a)}, '다시 듣기'));
    const opts = h('div', {class:'opts'});
    shuffled(q.o).forEach(o => opts.append(h('button', {class:'opt', onclick: () => pick(o === q.a)}, o)));
    card.append(opts, h('div', {style:'margin-top:16px'},
      h('button', {class:'btn quiet play', onclick: () => pick(false)}, '모르겠어요')));
    setTimeout(() => speak(q.a), 300);
    window.scrollTo(0,0);
  }

  function dictAsk(k){
    if(k >= CHECK_DICT.length) return result(MODULES.length + 1);
    const item = CHECK_DICT[k];
    card.innerHTML = ''; curGuide = null; bar(CHECK.length + k);
    let pendingCho = null, typed = '';
    card.append(h('h2', {}, '듣고 써 봐요'),
      guide('tori', k === 0 ? '거의 다 왔어. 이번엔 들리는 말을 직접 써 봐. 받침은 글자를 다 만든 다음에 눌러.' : '좋아, 하나 더.'));
    const box = h('div', {class:'dictbox'});
    const ans = h('div', {class:'answer', 'aria-live':'polite'}, '');
    const paint = () => { ans.textContent = typed + (pendingCho || ''); };
    box.append(h('button', {class:'btn play', onclick: () => speak(item.w)}, '다시 듣기'), ans);
    const rC = h('div', {class:'pickrow'}, h('b', {}, '자음'));
    pool.cho.forEach(j => rC.append(h('button', {class:'chip', onclick: () => { pendingCho = j; setFeedback(''); paint(); }}, j)));
    const rV = h('div', {class:'pickrow'}, h('b', {}, '모음'));
    pool.jung.forEach(j => rV.append(h('button', {class:'chip', onclick: () => {
      if(!pendingCho){ setFeedback('자음을 먼저 눌러요.', 'no'); return; }
      typed += compose(pendingCho, j); pendingCho = null; setFeedback(''); paint();
    }}, j)));
    const rJ = h('div', {class:'pickrow'}, h('b', {}, '받침'));
    pool.jong.forEach(j => rJ.append(h('button', {class:'chip', onclick: () => {
      if(!typed){ setFeedback('먼저 글자를 만들어요.', 'no'); return; }
      typed = typed.slice(0, -1) + addJong(typed[typed.length - 1], j); setFeedback(''); paint();
    }}, j)));
    const stop = () => { stopAt = item.w; result(item.n); };
    box.append(rC, rV, rJ, h('div', {style:'display:flex;gap:10px;margin-top:6px;flex-wrap:wrap'},
      h('button', {class:'btn quiet play', onclick: () => { pendingCho = null; typed = typed.slice(0, -1); paint(); }}, '지우기'),
      h('button', {class:'btn quiet play', onclick: stop}, '모르겠어요'),
      h('button', {class:'btn play', onclick: () => { setFeedback(''); typed === item.w ? dictAsk(k + 1) : stop(); }}, '확인')));
    card.append(box);
    setTimeout(() => speak(item.w), 400);
    window.scrollTo(0,0);
  }

  function result(s){
    startNight = s;
    saveStars();
    card.innerHTML = ''; curGuide = null; bar(total); setFeedback('');
    const all = s > MODULES.length;
    const msg = s === 1
      ? '첫째 밤부터 같이 하자. 소리부터 차근차근 익히면 금방 읽게 될 거야.'
      : all
      ? '첫째 달은 벌써 다 알고 있구나. 둘째 달에서 한국어로 말하기를 해 보자. 둘째 달에도 빠른 확인이 있어서, 아는 묶음은 건너뛸 수 있어.'
      : '벌써 ' + COUNT[s - 2] + ' 밤만큼 달이 차 있어. ' + nightName(s) + '부터 하면 좋겠어. ' + REASON[s - 1];
    const btns = h('div', {style:'display:flex;gap:12px;justify-content:center;flex-wrap:wrap'});
    if(!all) btns.append(h('button', {class:'btn', onclick: () => startModule(s)}, nightName(s) + ' 시작하기'));
    if(s > 1 && !all) btns.append(h('button', {class:'btn quiet', onclick: () => { startNight = 1; saveStars(); startModule(1); }}, '첫째 밤부터 할래요'));
    if(all) btns.append(h('button', {class:'btn', onclick: () => { location.href = '../second-moon/?check=1'; }}, '둘째 달 빠른 확인'));
    btns.append(h('button', {class:'btn quiet', onclick: showPicker}, '밤 고르기'));
    card.append(h('div', {style:'text-align:center;padding-top:6px'},
      h('div', {class:'scene'},
        h('div', {class:'moon', html: moonSVG(Math.min(s - 1, MODULES.length), 160, false)}),
        h('div', {class:'tori', html: CHAR.tori('happy')})),
      h('h2', {}, all ? '첫째 달을 다 알고 있어요' : nightName(s) + '부터 해요'),
      h('div', {style:'max-width:520px;margin:0 auto 12px;text-align:left'}, say('tori', msg)),
      h('p', {class:'checknote'}, '부모님께. 빠른 확인은 참고용입니다. 아이가 어려워하면 앞의 밤으로 돌아가도 괜찮습니다.'
        + (stopAt ? ' 확인이 멈춘 문제는 ' + josa(stopAt, '이에요') + '.' : '')),
      btns));
    window.scrollTo(0,0);
  }
}


/* ══════════════════════════════════════════════════════════════
   녹음 목록
   녹음실(record/)이 이 목록을 읽어 갑니다. 화면에서 소리 내는 말이 모두 들어 있습니다.
   글자 조립에서 아이가 자유롭게 만드는 글자는 경우의 수가 너무 많아 빠지고, 음성 합성이 맡습니다.
   ══════════════════════════════════════════════════════════════ */
function listClips(){
  const out = [], seen = new Set();
  const add = (text, night, label, say) => {
    if(!text || seen.has(text)) return;
    seen.add(text);
    out.push({id: clipId(text), text, night, label, say: say || '자연스러운 속도로 한 번'});
  };
  MODULES.forEach(m => {
    m.add.jung.forEach(j => add(jamoSound(j, 'jung'), m.n, j + ' 모음 소리', '모음 소리만 한 번'));
    m.add.cho.forEach(j => add(jamoSound(j, 'cho'), m.n, j + ' 첫소리', j === 'ㅇ' ? '첫소리 ㅇ은 소리가 없어요. [으]만 짧게' : '자음 소리를 [' + jamoSound(j, 'cho') + ']로 짧게'));
    m.add.jong.forEach(j => add(jamoSound(j, 'jong'), m.n, j + ' 받침 소리', '끝을 막듯이 짧게'));
    m.listen.forEach(q => add(q.a, m.n, '듣고 고르기'));
    m.words.forEach(w => add(w.w, m.n, '단어'));
    (m.cmp || []).forEach(c => add(c.s, m.n, '소리와 글자'));
    m.dict.forEach(w => add(w, m.n, '받아쓰기'));
  });
  CHECK.forEach(q => add(q.a, q.n, '빠른 확인'));
  CHECK_DICT.forEach(d => add(d.w, d.n, '빠른 확인 받아쓰기'));
  return out;
}


/* 주소에 ?night=7 처럼 붙이면 그 밤으로 바로 들어갑니다.
   홈 화면의 이어서 하기와, 선생님이 보내는 숙제 링크가 이걸 씁니다.
   ?check=1 이면 빠른 확인으로 들어갑니다. */
const params = new URLSearchParams(location.search);
/* 받아쓰기실은 자기 폴더로 옮겼습니다. 예전 숙제 링크(?dict=1)는 새 주소로 보냅니다. */
if(params.get('dict')) location.replace('../dictation/');
const qNight = Number(params.get('night'));
if(params.get('dict')) { /* 이동 중 */ }
else if(params.get('check')) startCheck();
else if(Number.isInteger(qNight) && qNight >= 1 && qNight <= MODULES.length) startModule(qNight);
else showPicker();
</script>
