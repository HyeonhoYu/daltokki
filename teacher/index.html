<style>
.troom{display:block;flex:none;max-width:980px;margin:0 auto;padding:26px 20px 60px;width:100%;box-sizing:border-box}
.troom .chip{font-size:15px;height:auto;min-width:0;padding:6px 12px;border-width:2px;border-radius:999px}
#monthTabs .chip{font-size:16px}
.troom h1{font-family:var(--display);font-weight:400;font-size:36px;margin:0 0 6px}
.troom .lede{color:#5A5248;max-width:46em;line-height:1.7}
#monthTabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
#monthTabs .chip.on{background:var(--hwang)}
.tbundle{border:3px solid var(--meok);border-radius:14px;background:var(--dalbit);padding:12px 16px;margin-bottom:14px}
.tbhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.tbhead h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.tbhead .btn{margin-left:auto;font-size:16px;padding:8px 14px}
.tnight{display:grid;grid-template-columns:5.5em 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed #C9C0AE}
.tnight code{grid-column:2 / 3;font-size:12px;color:#8C7F63;word-break:break-all}
.tnight .tnum{color:var(--juhong);font-size:14px}
.tnight .chip{font-size:14px;padding:4px 10px}
@media (max-width:640px){.tnight{grid-template-columns:1fr 1fr}.tnight code{grid-column:1 / -1}}
#preview{margin-top:24px}
.pvhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
/* 활동지 한 장 */
.sheet{background:#fff;color:#221F1C;max-width:8.5in;margin:0 auto 24px;padding:.5in .55in;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:14px;line-height:1.5}
.shead{border-bottom:3px solid #221F1C;padding-bottom:6px;margin-bottom:10px}
.shead > div:first-child{display:flex;justify-content:space-between;font-size:12px}
.sbrand{font-family:var(--display);font-size:16px;color:#C1403A}
.smeta{color:#5A5248}
.shead .stitle{font-family:var(--display);font-weight:400;font-size:28px;margin:2px 0}
.sname{font-size:13px}
.snameline{display:inline-block;width:14em;border-bottom:1.5px solid #221F1C;margin:0 12px 0 4px}
.snameline.short{width:8em}
.sbig{font-size:16px;margin:6px 0 10px}
.ssec{margin:12px 0;break-inside:avoid}
.ssec h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 6px;border-left:6px solid #E3A93C;padding-left:8px}
.ssec h3 small{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:#5A5248;margin-left:6px}
.swords{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sword{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto 34px;gap:2px 8px;border:1.5px solid #C9C0AE;border-radius:8px;padding:6px;break-inside:avoid}
.sword svg{grid-row:1 / 3}
.swtext b{font-size:18px;margin-right:6px}.swtext .sen{font-size:11px;color:#8C7F63;display:block}
.stag{font-size:11px;color:#fff;background:#8C7F63;border-radius:4px;padding:0 4px}
.strace,.sblank{border-bottom:1.5px dashed #8C7F63;font-size:22px;color:#D5CFC2;font-family:'Noto Sans KR',sans-serif;letter-spacing:.08em;display:inline-block}
.sword .strace{grid-column:2}.sword .sblank{display:none}
.sblock h4{margin:8px 0 4px;font-size:14px}
.sqrow{display:flex;gap:10px;align-items:center;margin-bottom:6px;break-inside:avoid}
.sq{margin:0 0 2px}
.sline2{color:#2D6E8E}
.sopts{display:flex;flex-wrap:wrap;gap:6px 18px}
.sletter{display:inline-block;width:1.5em;height:1.5em;border:1.5px solid #221F1C;border-radius:50%;text-align:center;line-height:1.4em;font-size:12px;margin-right:4px}
.spicopts{display:flex;gap:14px;margin-bottom:8px}
.spicopt{display:flex;align-items:center}
.sseq{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sseqcard{border:1.5px solid #C9C0AE;border-radius:8px;padding:6px;text-align:center;position:relative;break-inside:avoid}
.sseqcard p{margin:2px 0 0;font-size:12px}
.sbox{position:absolute;left:6px;top:6px;width:24px;height:24px;border:2px solid #221F1C;background:#fff}
.srule{margin:6px 0 2px;font-weight:700;font-size:13px}
.stable{border-collapse:collapse;width:100%;margin-bottom:4px}
.stable th,.stable td{border:1.5px solid #C9C0AE;padding:4px 8px;height:28px;text-align:left}
.stable th{background:#F5E6BD;font-weight:500}
.small{font-size:11px;color:#5A5248}
.sbuild{margin-bottom:10px;break-inside:avoid}
.snum{font-weight:700;margin-right:6px}
.sheettile{display:inline-block;border:1.5px solid #221F1C;border-radius:6px;padding:1px 8px;margin:0 4px 4px 0;background:#FBF7EC;font-size:14px}
.sjosa{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}.sjrow b{font-size:16px;margin-right:6px}
.sbuild .sen{font-size:11px;color:#8C7F63}
.swrite{border-bottom:1.5px solid #221F1C;height:26px;margin-top:4px}
.swrite.short{display:inline-block;width:12em;height:22px}
.sdict{display:flex;gap:28px;flex-wrap:wrap}
.sstory p{margin:2px 0}.sstory b{display:inline-block;min-width:4em;color:#C1403A}
.stask{margin-top:16px;border-top:2px dashed #221F1C;padding-top:8px;break-inside:avoid}
.scut{font-size:11px;color:#8C7F63;margin:0 0 4px}
.stask h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 4px}
.stask ul{margin:0 0 6px;padding-left:18px}.swhen{color:#2D6E8E;margin-right:4px}
.sparent{font-size:12px;margin:0}
.skey ul{margin:0;padding-left:18px}
.sjamo{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.sjrow2{display:flex;align-items:center;gap:4px;break-inside:avoid}
.sjrow2 svg{border:1.5px solid #C9C0AE;border-radius:4px;background:#fff}
.shint{font-size:11px;color:#8C7F63;margin-left:4px}
.sgrid th,.sgrid td{text-align:center;font-size:18px;width:3.2em}
.sgrid td.scell{height:40px}
#printArea{display:none}
@page{size:letter;margin:.4in}
@media print{
  html.printing-sheets body > *{display:none !important}
  html.printing-sheets #printArea{display:block !important}
  html.printing-sheets .sheet{box-shadow:none;margin:0;padding:0;max-width:none;break-after:page}
  html.printing-sheets .sheet:last-child{break-after:auto}
}

  <h1>선생님 방</h1>
  <p class="lede">밤마다 활동지를 인쇄하거나 PDF로 저장할 수 있습니다. 인쇄 창이 열리면 대상에서 "PDF로 저장"을 고르시면 파일로 받아집니다.
  활동지에는 새 낱말 따라 쓰기, 고르기 문제, 문장 만들기, 받아쓰기 칸, 이야기, 잘라서 집으로 보내는 가족 과제가 들어가고,
  정답은 마지막 장 선생님용 답안에 따로 모았습니다. 밤마다 적힌 주소는 학생에게 숙제 링크로 보내실 수 있습니다.
  첫째 달(한글 떼기)은 획순 번호가 붙은 자모 쓰기 연습장으로 드립니다.</p>
